name: Docs

# Verifies the hand-written help file, doc/numb.txt.
#
# The file is written by hand rather than generated from README.md with
# kdheepak/panvimdoc (latest release v4.0.1, inputs `vimdoc` and `description`),
# because a generated file cannot carry the tags this project needs: panvimdoc
# derives tags from markdown headings only, so there is no `*numb*` tag
# (`:help numb` then fuzzy-matches `:number` in the Neovim runtime docs instead
# of opening this plugin's help) and no tag per option or per API function.
# Those tags are what make `:help` useful, and adding them would mean putting
# vimdoc markup in README.md.
#
# The checks themselves live in scripts/verify_doc.lua and are driven by
# scripts/check.sh, so `./scripts/check.sh docs` reproduces this job exactly and
# the Lua is formatted and linted like the rest of the plugin. They pin the help
# file to the Lua sources: every option and every public function must have a
# tag, every option must appear in the Defaults block with the value the module
# really uses, every |cross reference| must resolve, and the file must stay
# inside the 78-column help convention. The stage also rejects en and em dashes
# across every tracked file and checks that the supported Neovim version is
# stated consistently.

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  vimdoc:
    name: Verify vimdoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Verify the help file
        run: ./scripts/check.sh docs
