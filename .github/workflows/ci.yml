name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  # Formatting and lint depend only on the Lua sources, so they run once instead
  # of once per Neovim version.
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned versions live in scripts/tools.sh, so a bump is one edit and
      # a contributor gets exactly what CI enforces.
      - name: Install stylua and selene
        run: sudo ./scripts/tools.sh /usr/local/bin

      - name: Run formatting and lint checks
        run: ./scripts/check.sh format lint

  test:
    name: Test (Neovim ${{ matrix.neovim_version }})
    runs-on: ubuntu-latest
    # Nightly Neovim breaks for reasons unrelated to this plugin, so it reports
    # without blocking. The pinned versions and stable stay blocking.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # v0.10.4 is the oldest supported release; v0.11.7 is the newest 0.11.x.
        neovim_version: ["v0.10.4", "v0.11.7", "stable"]
        experimental: [false]
        include:
          - neovim_version: "nightly"
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim_version }}

      - name: Run Neovim checks
        run: ./scripts/check.sh nvim
