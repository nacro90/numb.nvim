name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  # Formatting and lint depend only on the Lua sources, so they run once instead
  # of once per Neovim version.
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    env:
      STYLUA_VERSION: "0.20.0"
      SELENE_VERSION: "0.31.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Stylua
        run: |
          curl -fsSL -o stylua.zip \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          unzip -q stylua.zip stylua
          sudo install -m 0755 stylua /usr/local/bin/stylua
          stylua --version

      - name: Install selene
        run: |
          curl -fsSL -o selene.zip \
            "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-light-${SELENE_VERSION}-linux.zip"
          unzip -q selene.zip selene
          sudo install -m 0755 selene /usr/local/bin/selene
          selene --version

      - name: Run formatting and lint checks
        run: ./scripts/check.sh format lint

  test:
    name: Test (Neovim ${{ matrix.neovim_version }})
    runs-on: ubuntu-latest
    # Nightly Neovim breaks for reasons unrelated to this plugin, so it reports
    # without blocking. The pinned versions and stable stay blocking.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # v0.10.4 is the oldest supported release; v0.11.7 is the newest 0.11.x.
        neovim_version: ["v0.10.4", "v0.11.7", "stable"]
        experimental: [false]
        include:
          - neovim_version: "nightly"
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim_version }}

      - name: Run Neovim checks
        run: ./scripts/check.sh nvim
